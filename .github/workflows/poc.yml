name: cla-logic-poc
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: write
jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: Read Allowlist File
        id: read_allowlist
        run: |
          ALLOWLIST=$(printf 'alice,bob,carol')
          echo "allowlist=$ALLOWLIST" >> $GITHUB_OUTPUT
      - name: CLA Assistant (simulated, continue-on-error like the real one)
        id: cla_assistant
        continue-on-error: true
        run: |
          echo "Committers of Pull Request have to sign the CLA"
          exit 1
      - name: Check if user is in allowlist (verbatim target logic)
        id: check_allowlist
        run: |
          PR_USER=${{ github.event.pull_request.user.login }}
          echo "rendered PR_USER=[$PR_USER] len=${#PR_USER} event=${{ github.event_name }}"
          if [[ "${{ steps.read_allowlist.outputs.allowlist }}" == *"$PR_USER"* ]]; then
            echo "is_allowed=true" >> $GITHUB_OUTPUT
          else
            echo "is_allowed=false" >> $GITHUB_OUTPUT
          fi
          echo "cla_assistant.outcome=${{ steps.cla_assistant.outcome }}"
      - name: Label PR as CLA Unsigned (verbatim target condition)
        if: ${{ steps.cla_assistant.outcome != 'success' && steps.check_allowlist.outputs.is_allowed == 'false' }}
        run: |
          echo "TARGET WOULD LABEL cla: unsigned AND exit 1 (job failure = CLA gate enforced)"
          exit 1
      - name: Label PR as CLA Allowlist (verbatim target condition)
        if: ${{ steps.check_allowlist.outputs.is_allowed == 'true' }}
        run: |-
          if [[ "${{ github.event_name }}" == "pull_request_target" ]]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
          elif [[ "${{ github.event_name }}" == "issue_comment" ]]; then
            PR_NUMBER="${{ github.event.issue.number }}"
          fi
          ENDPOINT="https://api.github.com/repos/${{ github.repository }}/issues/$PR_NUMBER/labels"
          curl -s -o /dev/null -w 'delete unsigned status: %{http_code}\n' -L -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$ENDPOINT/cla:%20unsigned" || true
          curl -s -o /dev/null -w 'add allowlist status: %{http_code}\n' -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d '{"labels":["cla: allowlist"]}' "$ENDPOINT"
